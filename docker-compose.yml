services:
  horizont:
    build:
      context: .
      target: web        # Web-App + API (für Headless: docker-compose.headless.yml)
    image: horizont
    container_name: horizont
    restart: unless-stopped
    ports:
      - "8917:3000"
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
    volumes:
      - horizont-data:/app/data
    # Port nach Bedarf ändern, z. B. "8080:3000"

volumes:
  horizont-data:

# Live-Deployment: existierendes Daten-Volume hart referenzieren, damit Deploys
# die Live-Daten nie durch ein leeres Neuvolume ersetzen:
#   volumes:
#     horizont-data:
#       name: horizont_horizont-data
#       external: true
