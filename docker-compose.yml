services:
  horizont:
    build: .
    image: horizont
    container_name: horizont
    restart: unless-stopped
    ports:
      - "8917:3000"
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
    volumes:
      - horizont-data:/app/data
    # Port nach Bedarf ändern, z. B. "8080:3000"

# WICHTIG: Bestehendes Daten-Volume hart referenzieren, damit Deploys die
# Live-Daten nie durch ein leeres Neuvolume ersetzen (siehe Incident 2026-10-08).
# Passt zum Volume des Live-Containers (Project "horizont", Volume "horizont-data").
volumes:
  horizont-data:
    name: horizont_horizont-data
    external: true
