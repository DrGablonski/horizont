name: CI

on:
  push:
    branches: [main]
  pull_request:

# Hinweis: Gitea-Actions-kompatibel (GitHub-Actions-Syntax). Bei einem
# gitea-runner-docker ist das Label normalerweise "ubuntu-latest" – falls der
# Runner mit eigenen Labels registriert wurde (z. B. "linux,docker"), muss der
# runs-on-Wert unten entsprechend angepasst werden. Ebenso kann der Zugriff des
# Job-Containers auf git.home.gho.mom (Checkout + Bun-Registry) eine
# Runner-Netzwerk-Konfiguration (host-Netzwerk/DNS) erfordern.
jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: svelte-check
        run: bun run check

      - name: Tests
        run: bun run test

      - name: Lint (Biome)
        run: bun run lint
