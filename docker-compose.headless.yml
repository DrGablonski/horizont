# Horizont – Headless-Variante: nur REST-API (/api/*), keine Web-UI.
# Start:  docker compose -f docker-compose.headless.yml up -d --build
# Ersten Benutzer anlegen (UI gibt es hier nicht):
#   curl -X POST http://localhost:8917/api/auth/setup \
#     -H 'Content-Type: application/json' \
#     -d '{"username":"ich", "password":"…"}'
services:
  horizont:
    build:
      context: .
      target: headless   # Dockerfile-Build-Ziel ohne Web-UI
    image: horizont-headless
    container_name: horizont
    restart: unless-stopped
    ports:
      - "8917:3000"
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
    volumes:
      - horizont-data:/app/data

volumes:
  horizont-data:
