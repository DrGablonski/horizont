# XcodeGen-Definition – erzeugt HorizontiPad.xcodeproj via `xcodegen generate`.
# Natives iPadOS-Ziel (SwiftUI) + Widget-Extension. Der Code liegt komplett
# hier in ipad/Sources – eigenständiger Ordner, getrennt vom Mac-Projekt (apple/).
name: HorizontiPad
options:
  bundleIdPrefix: de.hott
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HorizontiPad:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Widgets/**"
      - path: Resources
    dependencies:
      - target: HorizontWidgets
        embed: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Horizont
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Selbst gehosteter Server läuft oft über HTTP (LAN/NetBird-IP).
        # Für produktiven Einsatz: Reverse Proxy mit gültigem TLS-Zertifikat.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Support/HorizontiPad.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.hott.horizont
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hott.horizont.ipad
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        CODE_SIGN_STYLE: Automatic

  HorizontWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Models
      - path: Sources/Support/AppGroup.swift
      - path: Sources/Support/Chrome.swift
      - path: Sources/Support/DesignSystem.swift
      - path: Sources/Support/Theme.swift
      - path: Sources/Support/ThemeStore.swift
      - path: Sources/Support/WidgetSnapshot.swift
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Horizont Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/HorizontWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.hott.horizont
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hott.horizont.ipad.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # ThemeStore (geteilter Support-Code) nutzlich UIApplication.shared –
        # in Extensions verboten; wird darüber im Code ausgeblendet.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
