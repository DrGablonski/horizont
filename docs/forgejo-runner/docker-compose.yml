# Forgejo Runner für git.home.gho.mom – Registrierung + Daemon in einem.
# Anleitung (Token holen etc.): docs/forgejo-runner.md im horizont-Repo.
services:
  forgejo-runner:
    # Offizielles OCI-Image, rolling-Major-Tag (aktuell v13.x)
    image: data.forgejo.org/forgejo/runner:13
    container_name: forgejo-runner
    restart: unless-stopped
    # Image läuft nativ als uid 1000; für den docker.sock-Zugriff ist root
    # hier der einfache Weg (Home-Host, nur eigene Repos). Alternative ohne
    # Socket-Root: dedizierter dind-Service, siehe
    # forgejo.org/docs/v15.0/admin/actions/installation/docker/
    user: root
    environment:
      - FORGEJO_RUNNER_REGISTRATION_TOKEN=${FORGEJO_RUNNER_REGISTRATION_TOKEN}
    volumes:
      # Standard-Konfigurationsverzeichnis des Runners (Registrierung + Cache)
      - ./config:/root/.config/forgejo-runner
      # Job-Container laufen auf dem Docker-Daemon des Hosts
      - /var/run/docker.sock:/var/run/docker.sock
    # git.home.gho.mom muss aus dem Runner-Container erreichbar sein
    # (Split-DNS/Haarnadel durch den Reverse-Proxy). Wenn's nicht klappt:
    # network_mode: host statt extra_hosts testen.
    extra_hosts:
      - "git.home.gho.mom:host-gateway"
    entrypoint: sh
    # Registriert sich beim ersten Start selbst (Labels ubuntu-latest UND
    # docker), danach nur noch Daemon. Die Registrierung liegt in der
    # ./config-Datei .runner und übersteht Container-Neubau und Updates.
    command: >
      -ec 'if [ ! -f /root/.config/forgejo-runner/.runner ]; then
      forgejo-runner register
      --instance https://git.home.gho.mom
      --token "$$FORGEJO_RUNNER_REGISTRATION_TOKEN"
      --name horizont-host-runner
      --labels "ubuntu-latest:docker://alpine:3.20,docker:docker://alpine:3.20"; fi;
      exec forgejo-runner daemon'
